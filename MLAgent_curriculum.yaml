behaviors:
    MLAgent:
        trainer_type: ppo

        # How many decisions to collect before each learning update
        hyperparameters:
            batch_size: 1024
            buffer_size: 10240
            learning_rate: 3.0e-4
            beta: 5.0e-3
            epsilon: 0.2
            lambd: 0.95
            num_epoch: 3
            learning_rate_schedule: linear

        # Small network
        network_settings:
            normalize: true
            hidden_units: 128
            num_layers: 2
            vis_encode_type: simple

        # Extrinsic reward only
        reward_signals:
            extrinsic:
                gamma: 0.99
                strength: 1.0
        
        # Episodes are capped at -20 seconds
        keep_checkpoints: 5
        max_steps: 2000000
        time_horizon: 128
        summary_freq: 10000

