default_settings: null
behaviors:
  MLAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 10000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters:
  spike_difficulty:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7224
          value: 0.0
      name: Lesson0_NoSpikes
      completion_criteria:
        behavior: MLAgent
        measure: reward
        min_lesson_length: 300
        signal_smoothing: true
        threshold: 25.0
        require_reset: true
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7225
          value: 0.5
      name: Lesson1_1Spike
      completion_criteria:
        behavior: MLAgent
        measure: reward
        min_lesson_length: 300
        signal_smoothing: true
        threshold: 22.0
        require_reset: true
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7226
          value: 1.0
      name: Lesson2_2Spikes
      completion_criteria: null
  enemy_difficulty:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7227
          value: 0.0
      name: Lesson0_NoEnemy
      completion_criteria:
        behavior: MLAgent
        measure: reward
        min_lesson_length: 300
        signal_smoothing: true
        threshold: 22.0
        require_reset: true
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7228
          value: 0.5
      name: Lesson1_1Enemy
      completion_criteria:
        behavior: MLAgent
        measure: reward
        min_lesson_length: 300
        signal_smoothing: true
        threshold: 22.0
        require_reset: true
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7229
          value: 1.0
      name: Lesson2_2Enemy
      completion_criteria: null
checkpoint_settings:
  run_id: mlagent_curriculum_groundenemy
  initialize_from: null
  load_model: false
  resume: true
  force: false
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: null
debug: false
